<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meridian · Choose your seat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--card:#141417;--line:#222226;--ink:#f3f3f5;--muted:#8d8d96;--mint:#8fdcb0;--mintInk:#0b3a26;--amber:#f2c879;--rose:#eca2a2;--amb:#b08a63;--px:0;--py:0;
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 1 0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.6'/></svg>")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
.phone{width:min(430px,100vw);height:min(900px,100vh);position:relative;overflow:hidden;border-radius:46px;background:var(--bg);box-shadow:0 40px 100px rgba(0,0,0,.7),0 0 0 1px #1c1c21,inset 0 0 0 1px rgba(255,255,255,.04)}
@media (max-width:480px){body{padding:0}.phone{border-radius:0;width:100vw;height:100dvh}}
.screen{position:absolute;inset:0;transition:opacity .5s ease,transform .75s cubic-bezier(.2,.8,.2,1),filter .5s ease}
.screen.is-hidden{opacity:0;transform:scale(.96);pointer-events:none}
#picker.is-out{opacity:0;transform:scale(1.14);filter:blur(8px);pointer-events:none}

.hdr{display:flex;justify-content:space-between;align-items:center;padding:22px 20px 0}
.circ{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);display:grid;place-items:center;cursor:pointer;flex:none;transition:background .2s;backdrop-filter:blur(10px)}
.circ:hover{background:rgba(255,255,255,.1)}
.circ svg{width:20px;height:20px}
.title{text-align:center}.title h1{font-size:22px;font-weight:600;letter-spacing:-.015em}.title p{color:var(--muted);font-size:14px;margin-top:4px}

/* ---------- picker ---------- */
#picker{background:radial-gradient(90% 40% at 50% 22%,#17171c 0%,#0b0b0e 60%,#070709 100%)}
.times{margin:18px auto 0;width:fit-content;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);border-radius:999px;padding:4px;display:flex;gap:4px}
.times button{background:transparent;border:0;color:#b9b9c0;padding:12px 17px;border-radius:999px;font-size:16px;font-weight:500;display:flex;gap:7px;align-items:baseline;cursor:pointer;transition:background .25s,color .25s}
.times button small{font-size:10.5px;letter-spacing:.06em;color:#7d7d86;font-weight:600}
.times button.on{background:#f1f1f3;color:#111;box-shadow:0 4px 14px rgba(0,0,0,.4)}.times button.on small{color:#555}
.arc{position:relative;height:150px;margin:6px 16px 0}
.arc svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.arc .label{position:absolute;left:0;right:0;top:74px;text-align:center;font-size:11px;letter-spacing:.34em;color:#6f6f78;font-weight:600}
.aud{padding:16px 24px 0 16px;transition:opacity .3s;position:relative}
.aud.swap{opacity:0}
.aud::before{content:"";position:absolute;left:36px;right:36px;top:0;bottom:0;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0) 40%);border-radius:40% 40% 0 0/14% 14% 0 0;pointer-events:none}
.row{display:grid;grid-template-columns:16px 1fr;align-items:center;gap:10px;margin-bottom:15px}
.row .lbl{color:#5d5d66;font-size:12.5px;font-variant-numeric:tabular-nums}
.blocks{display:grid;grid-template-columns:3fr 8fr 3fr;gap:20px}
.block{display:flex;justify-content:space-between}
.sw{width:22px;height:22px;position:relative}
.seat{position:absolute;inset:0;border:0;background:transparent;padding:0;cursor:pointer;transition:transform .18s cubic-bezier(.2,.8,.2,1);-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation;font-size:10px;font-weight:700;color:transparent;display:grid;place-items:center}
.seat::before{content:"";position:absolute;left:2px;right:2px;top:0;height:13px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#44444f,#33333c);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 4px rgba(0,0,0,.5)}
.seat::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;border-radius:3px 3px 6px 6px;background:linear-gradient(180deg,#3a3a44,#2a2a31);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 3px rgba(0,0,0,.5)}
.seat.taken{cursor:not-allowed}
.seat.taken::before{background:transparent;border:1.5px solid #2c2c33;box-shadow:none}
.seat.taken::after{background:transparent;border:1.5px solid #2c2c33;border-top:0;box-shadow:none}
.seat.recl::before{background:linear-gradient(180deg,#6b3f45,#4e2b31)}
.seat.recl::after{background:linear-gradient(180deg,#5c353b,#3f2328)}
.seat.taken.recl::before,.seat.taken.recl::after{background:transparent;border-color:#4a3036}
.seat:not(.taken):hover{transform:scale(1.18)}
.seat.sel,.seat.sel:hover{transform:scale(1.22);color:var(--mintInk)}
.seat.sel::before{background:linear-gradient(180deg,#a9ecc6,#8fdcb0);box-shadow:0 0 18px rgba(143,220,176,.55),inset 0 1px 0 rgba(255,255,255,.6)}
.seat.sel::after{background:linear-gradient(180deg,#8fdcb0,#6cc394)}
.seat span{position:relative;z-index:1;margin-top:-6px}
.seat.pressing{transform:scale(1.4)}
.legend{display:flex;justify-content:center;gap:18px;margin-top:22px;color:#8f8f98;font-size:13px}
.legend i{width:13px;height:13px;border-radius:4px;display:inline-block;vertical-align:-2px;margin-right:7px;background:linear-gradient(#44444f,#2a2a31)}
.legend i.t{background:transparent;border:1.5px solid #2c2c33}.legend i.r{background:linear-gradient(#6b3f45,#3f2328)}.legend i.s{background:linear-gradient(#a9ecc6,#6cc394)}
.bar{position:absolute;left:14px;right:14px;bottom:14px;background:rgba(22,22,26,.9);backdrop-filter:blur(16px);border-radius:30px;padding:20px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid rgba(255,255,255,.07);box-shadow:0 -10px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05)}
.bar .label{color:var(--muted);font-size:13.5px}.bar .price{font-size:23px;font-weight:600;margin-top:3px;letter-spacing:-.01em}
.bar .hintTxt{font-size:12.5px;color:#66666f;margin-top:5px}
.btn{height:58px;padding:0 28px;border-radius:999px;border:0;font-size:17px;font-weight:600;cursor:pointer;transition:transform .15s,opacity .2s,background .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.mint{background:linear-gradient(180deg,#a3e6c1,#8fdcb0);color:var(--mintInk);box-shadow:0 8px 24px rgba(143,220,176,.25)}
.btn.mint[disabled]{opacity:.35;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:rgba(255,255,255,.04);color:#eee;border:1px solid rgba(255,255,255,.12)}
.btn.white{background:linear-gradient(180deg,#ffffff,#e9e9ee);color:#111;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.btn.icon{width:58px;padding:0;display:grid;place-items:center}
.btn.icon svg{width:22px;height:22px}
.actions{display:flex;gap:8px}

/* ---------- seat view ---------- */
#view{background:#000}
#view .hdr{position:absolute;top:0;left:0;right:0;z-index:5}
.pill{background:rgba(20,20,24,.6);border-radius:999px;padding:13px 18px;font-size:15px;font-weight:500;display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(12px)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint)}
.hall{position:absolute;top:0;left:0;right:0;bottom:390px;overflow:hidden;background:#050405}
.hall .ceiling{position:absolute;inset:0;background:radial-gradient(70% 55% at 50% 42%,rgba(255,255,255,.05),rgba(0,0,0,0) 70%),linear-gradient(180deg,#0a080a 0%,#060506 50%,#0c0809 100%)}
.hall .ceiling::after{content:"";position:absolute;inset:0;background-image:var(--noise);opacity:.14;mix-blend-mode:overlay}
.wall{position:absolute;top:0;bottom:0;width:40%;pointer-events:none;background:linear-gradient(90deg,#1a1416 0%,#0e0b0c 60%,#080607 100%);transition:clip-path .9s cubic-bezier(.2,.8,.2,1)}
.wall.l{left:0;clip-path:polygon(0 0,var(--sl) var(--st),var(--sl) var(--sb),0 100%)}
.wall.r{right:0;background:linear-gradient(270deg,#1a1416 0%,#0e0b0c 60%,#080607 100%);clip-path:polygon(100% 0,var(--sr) var(--st),var(--sr) var(--sb),100% 100%)}
.wall::before{content:"";position:absolute;inset:0;background-image:var(--noise);opacity:.18;mix-blend-mode:overlay}
.sconce{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#ffe4b8 0,#f0b86a 35%,rgba(240,184,106,0) 70%);box-shadow:0 0 18px 6px rgba(240,170,90,.18);pointer-events:none;transition:all .9s cubic-bezier(.2,.8,.2,1)}
.scr{position:absolute;left:50%;top:var(--y,42%);width:100%;aspect-ratio:16/9;transform:translate(calc(-50% + var(--dx,0px)),-50%) scale(var(--s,.8));transition:transform .9s cubic-bezier(.2,.8,.2,1),top .9s cubic-bezier(.2,.8,.2,1),opacity .5s;opacity:1;will-change:transform}
.scr.enter{opacity:0}
.scr .bloom{position:absolute;left:-14%;top:-22%;width:128%;height:144%;filter:blur(28px) saturate(1.2);opacity:.6;pointer-events:none}
.scr canvas.film{position:absolute;inset:0;width:100%;height:100%;display:block;background:#000;box-shadow:0 0 0 5px #060606,0 0 0 6px rgba(255,255,255,.06),0 30px 80px rgba(0,0,0,.9)}
.scr .sheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.18));mix-blend-mode:overlay}
.floor{position:absolute;left:-10%;right:-10%;bottom:0;height:46%;background:linear-gradient(180deg,rgba(20,12,10,0) 0%,#140d0c 45%,#1a110f 100%);pointer-events:none}
.ahead{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.srow{position:relative;display:flex;gap:6px;transform-origin:bottom center;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .6s}
.srow+.srow{margin-top:-50px}
.srow::after{content:"";position:absolute;left:-40%;right:-40%;bottom:14px;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,190,110,0),rgba(255,190,110,.5) 30%,rgba(255,190,110,.5) 70%,rgba(255,190,110,0));filter:blur(.6px);opacity:.75}
.srow svg{width:104px;height:134px;overflow:visible;display:block;filter:drop-shadow(0 -8px 18px rgba(0,0,0,.55))}
.sheet{position:absolute;left:0;right:0;bottom:0;height:390px;background:rgba(20,20,24,.96);backdrop-filter:blur(20px);border-radius:34px 34px 0 0;padding:14px 24px 20px;box-shadow:0 -24px 60px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);z-index:3}
.grab{width:50px;height:5px;border-radius:3px;background:#2d2d33;margin:0 auto 20px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.tag{font-size:11.5px;letter-spacing:.14em;font-weight:700;color:var(--mint);transition:color .3s}
.tag.warn{color:var(--amber)}.tag.rose{color:var(--rose)}
.top h2{font-size:30px;font-weight:600;letter-spacing:-.02em;margin-top:9px;line-height:1.05}
.top p{color:var(--muted);font-size:15px;margin-top:7px}
.mini{width:112px;height:90px;position:relative;flex:none;margin-top:4px}
.mini svg{position:absolute;left:0;right:0;top:0;width:100%;height:18px;overflow:visible}
.mini .grid{position:absolute;left:4px;right:4px;top:22px;bottom:0;display:grid;grid-template-rows:repeat(9,1fr);gap:2px}
.mini .mrow{display:grid;grid-template-columns:3fr 1fr 8fr 1fr 3fr}
.mini .mb{display:flex;justify-content:space-between}
.mini .md{width:5px;height:5px;border-radius:1.5px;background:#3a3a42;cursor:pointer;transition:background .3s,transform .3s}
.mini .md.recl{background:#5f3b40}
.mini .md.taken{background:#232328;cursor:default}
.mini .md.sel{background:var(--mint);box-shadow:0 0 8px var(--mint);transform:scale(1.5)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:24px}
.stat{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:15px 15px 13px}
.stat b{display:block;font-size:23px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat span{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
.acts{display:flex;gap:12px;margin-top:22px}
.acts .btn{flex:1;height:60px;font-size:18px}
.edge{position:absolute;top:30%;bottom:30%;width:22%;z-index:4;cursor:pointer;opacity:0;transition:opacity .25s}
.edge.l{left:0}.edge.r{right:0}
.edge:hover{opacity:1}
.edge span{position:absolute;top:50%;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;transform:translateY(-50%);backdrop-filter:blur(4px)}
.edge.l span{left:14px}.edge.r span{right:14px}
.edge svg{width:18px;height:18px}
.toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,20px);background:#f3f3f5;color:#111;padding:14px 22px;border-radius:999px;font-weight:600;opacity:0;transition:all .4s;z-index:20;pointer-events:none;max-width:88%;text-align:center;font-size:14px;line-height:1.35}
.toast.show{opacity:1;transform:translate(-50%,0)}
.defs{position:absolute;width:0;height:0;overflow:hidden}
</style>
</head>
<body>
<svg class="defs" aria-hidden="true">
  <defs>
    <linearGradient id="velvet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9362c"/><stop offset=".5" stop-color="#8a1f17"/><stop offset="1" stop-color="#3e0a08"/></linearGradient>
    <radialGradient id="velHL" cx="50%" cy="20%" r="65%"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="velSide" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset=".18" stop-color="#000" stop-opacity="0"/><stop offset=".82" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient>
    <radialGradient id="head" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#2a1a18"/><stop offset="1" stop-color="#070404"/></radialGradient>
  </defs>
</svg>
<div class="phone">

  <!-- ===== Picker ===== -->
  <section class="screen" id="picker">
    <header class="hdr">
      <button class="circ" aria-label="Back" onclick="history.length>1?history.back():location.href='index.html'"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="title"><h1>Meridian</h1><p>Hall 3 · Fri 14 Nov</p></div>
      <button class="circ" aria-label="Info"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
    </header>
    <div class="times" id="times">
      <button data-t="17:30">17:30 <small>2D</small></button>
      <button data-t="19:45" class="on">19:45 <small>IMAX</small></button>
      <button data-t="22:15">22:15 <small>2D</small></button>
    </div>
    <div class="arc">
      <svg viewBox="0 0 400 110" preserveAspectRatio="none">
        <defs>
          <linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".05"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>
          <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <filter id="bl"><feGaussianBlur stdDeviation="6"/></filter>
        </defs>
        <path d="M10 44 Q200 -8 390 44 L390 110 L10 110 Z" fill="url(#glow)" filter="url(#bl)" opacity=".9"/>
        <path d="M10 44 Q200 -8 390 44" stroke="url(#lg)" stroke-width="3" fill="none"/>
        <path d="M10 44 Q200 -8 390 44" stroke="#fff" stroke-opacity=".35" stroke-width="10" fill="none" filter="url(#bl)"/>
      </svg>
      <div class="label">SCREEN</div>
    </div>
    <div class="aud" id="aud"></div>
    <div class="legend"><span><i></i>Available</span><span><i class="t"></i>Taken</span><span><i class="r"></i>Recliner</span><span><i class="s"></i>Selected</span></div>
    <div class="bar">
      <div>
        <div class="label" id="bLabel">Tap a seat</div>
        <div class="price" id="bPrice" hidden>€12.50</div>
        <div class="hintTxt" id="bHint">Hold a seat to preview the view</div>
      </div>
      <div class="actions">
        <button class="btn ghost icon" id="bView" aria-label="Preview view" hidden><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button class="btn mint" id="bCont" disabled>Continue</button>
      </div>
    </div>
  </section>

  <!-- ===== Seat view ===== -->
  <section class="screen is-hidden" id="view">
    <header class="hdr">
      <button class="circ" id="vBack" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="pill"><i></i><span id="pillTxt">View from F8</span></div>
      <div style="width:48px"></div>
    </header>
    <div class="hall" id="hall">
      <div class="ceiling"></div>
      <div class="wall l" id="wallL"></div><div class="wall r" id="wallR"></div>
      <div class="sconce" id="sc1"></div><div class="sconce" id="sc2"></div><div class="sconce" id="sc3"></div><div class="sconce" id="sc4"></div>
      <div class="scr enter" id="scr"><canvas class="bloom" id="bloom" width="64" height="36"></canvas><canvas class="film" id="film" width="640" height="360"></canvas><div class="sheen"></div></div>
      <div class="floor"></div>
      <div class="ahead" id="ahead"></div>
      <div class="edge l" id="edgeL"><span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></span></div>
      <div class="edge r" id="edgeR"><span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span></div>
    </div>
    <div class="sheet">
      <div class="grab"></div>
      <div class="top">
        <div>
          <div class="tag" id="tag">SWEET SPOT</div>
          <h2 id="vName">Row F, Seat 8</h2>
          <p id="vMeta">Standard · €12.50</p>
        </div>
        <div class="mini" id="mini"><svg viewBox="0 0 100 16" preserveAspectRatio="none"><path d="M4 12 Q50 -2 96 12" stroke="#fff" stroke-opacity=".8" stroke-width="2" fill="none"/></svg><div class="grid" id="miniGrid"></div></div>
      </div>
      <div class="stats">
        <div class="stat"><b id="sDist">9.8 m</b><span>to screen</span></div>
        <div class="stat"><b id="sFov">60°</b><span>field of view</span></div>
        <div class="stat"><b id="sOff">0.3 m</b><span id="sOffL">right of centre</span></div>
      </div>
      <div class="acts"><button class="btn ghost" id="vChange">Change seat</button><button class="btn white" id="vBook">Book · €12.50</button></div>
    </div>
  </section>

  <div class="toast" id="toast">Booked ✓</div>
</div>

<script>
const $=s=>document.querySelector(s);
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=(a,b)=>{let h=(a*374761393+b*668265263)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296};
const ROWS='ABCDEFGHI'.split(''), COLS=14, BLOCKS=[3,8,3], SEEDS={'17:30':31,'19:45':77,'22:15':119};
let show='19:45', taken=new Set(), sel=null;
const key=(r,c)=>r+'-'+c, isRecl=r=>r>=7, priceOf=r=>isRecl(r)?16.5:12.5, fmt=p=>'€'+p.toFixed(2);

function buildTaken(){
  taken.clear(); const q=rng(SEEDS[show]);
  ROWS.forEach((_,r)=>{for(let c=1;c<=COLS;c++){const p=r<=1?0.35:r>=7?0.5:0.46;if(q()<p)taken.add(key(r,c))}});
  ['5-8','1-4','4-7','5-7','3-6'].forEach(k=>taken.delete(k));
}
/* ---------- picker grid (rows curve gently toward the screen) ---------- */
const aud=$('#aud');
function renderGrid(){
  aud.innerHTML='';
  ROWS.forEach((L,r)=>{
    const row=document.createElement('div');row.className='row';
    row.innerHTML=`<div class="lbl">${L}</div>`;
    const blocks=document.createElement('div');blocks.className='blocks';
    let c=1;
    BLOCKS.forEach(n=>{const b=document.createElement('div');b.className='block';
      for(let k=0;k<n;k++,c++){
        const w=document.createElement('div');w.className='sw';const d=c-7.5;w.style.transform=`translateY(${(d*d*0.32).toFixed(1)}px) rotate(${(d*1.1).toFixed(1)}deg)`;
        const s=document.createElement('button');s.className='seat';s.dataset.r=r;s.dataset.c=c;s.innerHTML=`<span>${c}</span>`;
        if(isRecl(r))s.classList.add('recl'); if(taken.has(key(r,c)))s.classList.add('taken');
        if(sel&&sel.r===r&&sel.c===c)s.classList.add('sel');
        s.setAttribute('aria-label',`Row ${L} seat ${c}`);w.appendChild(s);b.appendChild(w)}
      blocks.appendChild(b)});
    row.appendChild(blocks);aud.appendChild(row);
  });
}
function updateBar(){
  const has=!!sel;
  $('#bPrice').hidden=!has;$('#bView').hidden=!has;$('#bCont').disabled=!has;
  if(has){$('#bLabel').textContent=`Row ${ROWS[sel.r]} · Seat ${sel.c}`;$('#bPrice').textContent=fmt(priceOf(sel.r));$('#bHint').hidden=true}
  else{$('#bLabel').textContent='Tap a seat';$('#bHint').hidden=false}
}
function select(r,c){
  sel={r,c};aud.querySelectorAll('.seat.sel').forEach(s=>s.classList.remove('sel'));
  const el=aud.querySelector(`.seat[data-r="${r}"][data-c="${c}"]`);el&&el.classList.add('sel');updateBar();
}
let pressT=0,pressed=null,longFired=false;
aud.addEventListener('pointerdown',e=>{
  const s=e.target.closest('.seat');if(!s||s.classList.contains('taken'))return;
  pressed=s;longFired=false;s.classList.add('pressing');
  pressT=setTimeout(()=>{longFired=true;s.classList.remove('pressing');select(+s.dataset.r,+s.dataset.c);openView()},380);
});
const endPress=()=>{clearTimeout(pressT);if(pressed)pressed.classList.remove('pressing');pressed=null};
['pointerup','pointercancel','pointerleave'].forEach(ev=>aud.addEventListener(ev,endPress,true));
aud.addEventListener('click',e=>{
  const s=e.target.closest('.seat');if(!s||s.classList.contains('taken'))return;
  if(longFired){longFired=false;return}
  select(+s.dataset.r,+s.dataset.c);
});
$('#times').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.dataset.t===show)return;
  $('#times .on').classList.remove('on');b.classList.add('on');show=b.dataset.t;
  aud.classList.add('swap');setTimeout(()=>{buildTaken();if(sel&&taken.has(key(sel.r,sel.c)))sel=null;renderGrid();updateBar();buildMini();aud.classList.remove('swap')},280);
});
$('#bView').onclick=()=>openView();
$('#bCont').onclick=()=>toast(`Row ${ROWS[sel.r]} · Seat ${sel.c} added · ${fmt(priceOf(sel.r))}`);

/* ---------- seat view ---------- */
const SCREEN_W=11.5, CAM=0.7;
const geo=(r,c)=>{const d=3.6+r*1.25,x=(c-7.5)*0.55;return{d,x,fov:2*Math.atan(SCREEN_W/2/d)*180/Math.PI}};
function verdict(r,g){if(r<=1)return['CLOSE TO SCREEN','warn'];if(Math.abs(g.x)>2.4)return['OFF TO THE SIDE','warn'];if(r>=7)return['RECLINER · BACK ROW','rose'];return['SWEET SPOT','']}
const scr=$('#scr'), hall=$('#hall'), ahead=$('#ahead');
// one cinema seat back, optionally with a viewer's head and shoulders in it
function seatSVG(withHead,flip){
  const head=withHead?`<g transform="translate(${flip?-4:4} 0)"><path d="M24 44 Q60 14 96 44 L98 70 L22 70Z" fill="#0d0607"/><ellipse cx="60" cy="10" rx="17" ry="23" fill="url(#head)"/><path d="M44 2 Q60 -16 76 3" stroke="var(--amb)" stroke-opacity=".55" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M28 48 Q60 26 92 48" stroke="var(--amb)" stroke-opacity=".25" stroke-width="2" fill="none"/></g>`:'';
  return `<svg viewBox="0 -30 120 162" aria-hidden="true">${head}
    <path d="M10 132 V46 Q10 14 42 14 H78 Q110 14 110 46 V132Z" fill="url(#velvet)"/>
    <path d="M10 132 V46 Q10 14 42 14 H78 Q110 14 110 46 V132Z" fill="url(#velHL)"/>
    <path d="M10 132 V46 Q10 14 42 14 H78 Q110 14 110 46 V132Z" fill="url(#velSide)"/>
    <path d="M22 44 Q60 32 98 44 Q98 62 60 66 Q22 62 22 44Z" fill="rgba(0,0,0,.22)"/>
    <path d="M13 46 Q13 17 42 17 H78 Q107 17 107 46" fill="none" stroke="var(--amb)" stroke-opacity=".5" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M0 126 H120 V132 H0Z" fill="#1c0806"/>
  </svg>`;
}
function applyView(r,c){
  const g=geo(r,c), hw=hall.clientWidth||400, hh=hall.clientHeight||500;
  const s=Math.min(2.1,SCREEN_W/(2*g.d*CAM));
  const dx=-(g.x/(g.d*CAM))*(hw/2)*1.4;
  const yPct=44-(s-0.8)*6;
  scr.style.setProperty('--s',s.toFixed(3));scr.style.setProperty('--dx',dx.toFixed(1)+'px');scr.style.setProperty('--y',yPct.toFixed(1)+'%');
  // side walls converge on the screen edges
  const sw=hw*s, sh=sw*9/16, cx=hw/2+dx, cy=hh*yPct/100;
  const sl=((cx-sw/2)/hw*100), sr=((cx+sw/2)/hw*100), st=((cy-sh/2)/hh*100), sb=((cy+sh/2)/hh*100);
  hall.style.setProperty('--sl',sl.toFixed(1)+'%');hall.style.setProperty('--sr',sr.toFixed(1)+'%');hall.style.setProperty('--st',st.toFixed(1)+'%');hall.style.setProperty('--sb',sb.toFixed(1)+'%');
  [['#sc1',0.12,0.55],['#sc2',0.62,0.72],['#sc3',0.12,0.55],['#sc4',0.62,0.72]].forEach(([id,k,sz],i)=>{const left=i<2;const e=$(id);const xP=left?sl*k:100-(100-sr)*k;const yP=st+(sb-st)*(0.25+k*0.35)+(1-k)*12;e.style.left=`calc(${xP.toFixed(1)}% - 5px)`;e.style.top=`calc(${yP.toFixed(1)}% - 5px)`;e.style.transform=`scale(${sz+0.3*(1-s/2)})`;e.style.opacity=Math.min(1,0.25+(1-k)*0.6)});
  // seat backs ahead, with a few other viewers
  const n=Math.min(r,3), scales=[1,.74,.55];
  ahead.innerHTML='';
  for(let i=n-1;i>=0;i--){const row=document.createElement('div');row.className='srow';row.style.transform=`scale(${scales[i]}) translateX(${(-g.x*8*(i+1)).toFixed(0)}px)`;row.style.filter=`brightness(${(1-i*.2).toFixed(2)})`;
    for(let k=0;k<7;k++){const hasHead=hash(r*31+i*7+k,c*13+i)<(i===0?0.38:0.5)&&!(i===0&&k===3);row.insertAdjacentHTML('beforeend',seatSVG(hasHead,k<3))}
    ahead.appendChild(row)}
  const [tag,cls]=verdict(r,g);const t=$('#tag');t.textContent=tag;t.className='tag '+cls;
  $('#vName').textContent=`Row ${ROWS[r]}, Seat ${c}`;$('#pillTxt').textContent=`View from ${ROWS[r]}${c}`;
  $('#vMeta').textContent=`${isRecl(r)?'Recliner':'Standard'} · ${fmt(priceOf(r))}`;$('#vBook').textContent=`Book · ${fmt(priceOf(r))}`;
  $('#sDist').textContent=g.d.toFixed(1)+' m';$('#sFov').textContent=Math.round(g.fov)+'°';
  const ax=Math.abs(g.x);$('#sOff').textContent=ax<0.2?'centre':ax.toFixed(1)+' m';$('#sOffL').textContent=ax<0.2?'dead centre':g.x>0?'right of centre':'left of centre';
  $('#miniGrid').querySelectorAll('.md').forEach(d=>d.classList.toggle('sel',+d.dataset.r===r&&+d.dataset.c===c));
}
function openView(){
  if(!sel)return;
  $('#picker').classList.add('is-out');$('#view').classList.remove('is-hidden');
  scr.classList.add('enter');scr.style.setProperty('--s','.3');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{scr.classList.remove('enter');applyView(sel.r,sel.c)}));
  filmOn=true;if(!raf)raf=requestAnimationFrame(film);
}
function closeView(){$('#picker').classList.remove('is-out');$('#view').classList.add('is-hidden');filmOn=false}
$('#vBack').onclick=$('#vChange').onclick=closeView;
$('#vBook').onclick=()=>toast(`Booked Row ${ROWS[sel.r]} · Seat ${sel.c} ✓`);
function go(r,c){if(taken.has(key(r,c)))return;select(r,c);applyView(r,c)}
function step(dr,dc){
  let r=sel.r,c=sel.c;
  for(let i=0;i<14;i++){r+=dr;c+=dc;if(r<0||r>=ROWS.length||c<1||c>COLS)return;if(!taken.has(key(r,c))){go(r,c);return}}
}
$('#edgeL').onclick=()=>step(0,-1);$('#edgeR').onclick=()=>step(0,1);
document.addEventListener('keydown',e=>{if($('#view').classList.contains('is-hidden'))return;
  if(e.key==='ArrowLeft')step(0,-1);if(e.key==='ArrowRight')step(0,1);if(e.key==='ArrowUp')step(-1,0);if(e.key==='ArrowDown')step(1,0);if(e.key==='Escape')closeView()});
$('#scr').addEventListener('dblclick',()=>toast(FILM_CREDIT,3200));
let sy=null;hall.addEventListener('pointerdown',e=>sy=e.clientY);hall.addEventListener('pointerup',e=>{if(sy===null)return;const d=e.clientY-sy;sy=null;if(Math.abs(d)>40)step(d>0?-1:1,0)});

/* minimap */
function buildMini(){
  const g=$('#miniGrid');g.innerHTML='';
  ROWS.forEach((_,r)=>{const row=document.createElement('div');row.className='mrow';let c=1;
    BLOCKS.forEach((n,bi)=>{const b=document.createElement('div');b.className='mb';for(let k=0;k<n;k++,c++){const d=document.createElement('div');d.className='md'+(isRecl(r)?' recl':'')+(taken.has(key(r,c))?' taken':'');d.dataset.r=r;d.dataset.c=c;b.appendChild(d)}
      row.appendChild(b);if(bi<2)row.appendChild(document.createElement('div'))});
    g.appendChild(row)});
}
$('#miniGrid').addEventListener('click',e=>{const d=e.target.closest('.md');if(d&&!d.classList.contains('taken'))go(+d.dataset.r,+d.dataset.c)});

/* ---------- the film: a real still with a slow push-in; dunes drawn as fallback ---------- */
const fc=$('#film'), fx=fc.getContext('2d'), bc=$('#bloom'), bx=bc.getContext('2d',{willReadFrequently:true});
let raf=0, filmOn=false, filmImg=null, filmT0=0, lastAmb=0, frameN=0;
const FILM_SRC='https://upload.wikimedia.org/wikipedia/commons/thumb/2/24/%22Ein_beeindruckender_Teil_der_Sahara%22._01.jpg/1280px-%22Ein_beeindruckender_Teil_der_Sahara%22._01.jpg';
const FILM_CREDIT='Still: Erg Chebbi, Sahara — Holger Uwe Schmitt, CC BY-SA 4.0, via Wikimedia Commons';
(function(){const im=new Image();im.decoding='async';im.referrerPolicy='no-referrer';im.onload=()=>{filmImg=im};im.src=FILM_SRC})();
function drawPhotoFilm(w,h,time){
  const u=((time-filmT0)%40)/40, e=u<0.5?u*2:(1-u)*2;
  const iw=filmImg.naturalWidth, ih=filmImg.naturalHeight, z=1.08+0.14*e;
  const cover=Math.max(w/iw,h/ih)*z, dw=iw*cover, dh=ih*cover;
  const fx0=0.42+0.14*e, fy0=0.48;
  const dx=Math.max(w-dw,Math.min(0,w/2-fx0*dw)), dy=Math.max(h-dh,Math.min(0,h/2-fy0*dh));
  fx.drawImage(filmImg,dx,dy,dw,dh);
  let g=fx.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(0,0,0,.22)');g.addColorStop(.25,'rgba(0,0,0,0)');g.addColorStop(.8,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.3)');fx.fillStyle=g;fx.fillRect(0,0,w,h);
  fx.fillStyle='rgba(0,0,0,.045)';for(let i=0;i<90;i++)fx.fillRect(Math.random()*w,Math.random()*h,2,2);
}
const dune=(seed)=>{const q=rng(seed);const f=[[q()*0.004+0.003,q()*6,1],[q()*0.01+0.008,q()*6,.4],[q()*0.03+0.02,q()*6,.12]];return (x,base,amp)=>{let y=base;for(const k of f)y+=Math.sin(x*k[0]+k[1])*amp*k[2];return y}};
const D=[dune(1),dune(2),dune(3),dune(4)];
function drawDunes(w,h,time){
  let g=fx.createLinearGradient(0,0,0,h*0.6);g.addColorStop(0,'#cfc3b3');g.addColorStop(0.7,'#e4d9c8');g.addColorStop(1,'#ecdfcb');fx.fillStyle=g;fx.fillRect(0,0,w,h);
  g=fx.createRadialGradient(w*0.7,h*0.4,0,w*0.7,h*0.4,w*0.6);g.addColorStop(0,'rgba(255,245,225,.55)');g.addColorStop(1,'rgba(255,245,225,0)');fx.fillStyle=g;fx.fillRect(0,0,w,h);
  const layers=[[0.50,22,'#d9c6a6','#c9b28c'],[0.60,34,'#cdb68f','#b89b70'],[0.72,42,'#c2a57a','#a3845a'],[0.88,54,'#b08f62','#8a6b43']];
  let figY=0,figX=(w*0.25+time*9)%(w*1.15)-w*0.07;
  layers.forEach((L,i)=>{
    const pan=time*(4+i*5);const base=h*L[0],amp=L[1];
    fx.beginPath();fx.moveTo(0,h+5);for(let x=0;x<=w;x+=4){fx.lineTo(x,D[i](x+pan,base,amp))}fx.lineTo(w,h+5);fx.closePath();
    g=fx.createLinearGradient(0,base-amp,0,h);g.addColorStop(0,L[2]);g.addColorStop(1,L[3]);fx.fillStyle=g;fx.fill();
    fx.save();fx.clip();g=fx.createLinearGradient(0,0,w,0);g.addColorStop(0,'rgba(60,35,10,.22)');g.addColorStop(.5,'rgba(255,240,210,.0)');g.addColorStop(1,'rgba(255,240,210,.25)');fx.fillStyle=g;fx.fillRect(0,0,w,h);fx.restore();
    fx.beginPath();for(let x=0;x<=w;x+=4){const y=D[i](x+pan,base,amp);x===0?fx.moveTo(x,y):fx.lineTo(x,y)}fx.strokeStyle='rgba(255,246,225,.45)';fx.lineWidth=1.5;fx.stroke();
    if(i===1)figY=D[i](figX+pan,base,amp);
  });
  fx.fillStyle='#2a1f16';fx.fillRect(figX-1.2,figY-9,2.4,9);fx.beginPath();fx.arc(figX,figY-10.5,1.7,0,Math.PI*2);fx.fill();
  g=fx.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(0,0,0,.18)');g.addColorStop(.2,'rgba(0,0,0,0)');g.addColorStop(.8,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.25)');fx.fillStyle=g;fx.fillRect(0,0,w,h);
}
function film(ts){
  if(filmOn){
    const time=ts/1000;
    if(filmImg)drawPhotoFilm(fc.width,fc.height,time);else drawDunes(fc.width,fc.height,time);
    // light bleed onto the room + ambient colour for the seats
    if(frameN++%2===0){bx.drawImage(fc,0,0,64,36)}
    if(ts-lastAmb>300){lastAmb=ts;const d=bx.getImageData(0,0,64,36).data;let r=0,g=0,b=0;for(let i=0;i<d.length;i+=16){r+=d[i];g+=d[i+1];b+=d[i+2]}const n=d.length/16;r/=n;g/=n;b/=n;const k=1.15;document.documentElement.style.setProperty('--amb',`rgb(${Math.min(255,r*k)|0},${Math.min(255,g*k)|0},${Math.min(255,b*k)|0})`)}
  }
  raf=requestAnimationFrame(film);
}
function toast(msg,ms=1800){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),ms)}

/* init */
buildTaken();renderGrid();buildMini();select(1,4);
window.addEventListener('resize',()=>{if(!$('#view').classList.contains('is-hidden')&&sel)applyView(sel.r,sel.c)});
</script>
</body>
</html>
